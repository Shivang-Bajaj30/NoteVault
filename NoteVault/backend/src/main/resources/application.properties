spring.application.name=notevault-backend
server.port=8080

# JWT (override in production via env vars / backend/.env)
notevault.jwt-secret=${JWT_SECRET:notevault-dev-secret-change-me}
notevault.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,https://*.onrender.com}
notevault.demo.enabled=${NOTEVAULT_DEMO_ENABLED:true}

# MongoDB Atlas — set MONGODB_URI in backend/.env or as an env var.
# The database name is pinned here and in MongoConfig.
spring.data.mongodb.database=notevault
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}

# Kafka publishing is optional. Enable it with NOTEVAULT_KAFKA_ENABLED=true and configure KAFKA_BOOTSTRAP_SERVERS.
notevault.kafka.enabled=${NOTEVAULT_KAFKA_ENABLED:false}
notevault.streams.health-url=${NOTEVAULT_STREAMS_HEALTH_URL:http://localhost:8081/api/health/streams}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Never let an unavailable broker stall an HTTP request for Kafka's 60-second default.
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.admin.fail-fast=false
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

logging.level.org.springframework=INFO
logging.level.org.springframework.data.mongodb=WARN
