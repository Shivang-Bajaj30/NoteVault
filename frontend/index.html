<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NoteVault - Peer-moderated academic notes, AI flashcards, and verified study resources" />
    <title>NoteVault · Verified academic notes</title>

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Anti-FOUC Theme Script: Force light mode as default -->
    <script>
      (function() {
        try {
          // Always force light mode — reset any stale dark preference
          localStorage.setItem('nv-theme', 'light');
          document.documentElement.classList.remove('dark');
          document.documentElement.dataset.theme = 'light';
          document.documentElement.style.colorScheme = 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-indigo-100 selection:text-indigo-800">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
